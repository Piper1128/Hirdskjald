<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hirdskjald</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --bg:#14100c; --panel:#1e1812; --ink:#ece3d4; --dim:#a99b84;
    --gold:#c9a24b; --ember:#d1662b; --line:#3a2f22;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#241a10,#14100c);
    color:var(--ink);font:16px/1.6 "Iowan Old Style","Palatino Linotype",Georgia,serif}
  header{text-align:center;padding:26px 16px 6px}
  header h1{margin:0;font-size:34px;letter-spacing:.14em;color:var(--gold);
    text-shadow:0 0 24px rgba(201,162,75,.25)}
  header p{margin:6px 0 0;color:var(--dim);font-style:italic}
  .wrap{max-width:820px;margin:0 auto;padding:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:10px}
  .log{min-height:200px;max-height:58vh;overflow:auto;padding:4px 2px}
  .msg{margin:12px 0;padding:12px 14px;border-radius:12px;white-space:pre-wrap}
  .me{background:#241d14;border:1px solid var(--line)}
  .sk{background:linear-gradient(180deg,#241a0f,#1c1409);border:1px solid #4a3a1f}
  .who{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .sk .who{color:var(--gold)}
  textarea{width:100%;background:#120e0a;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:11px;font-family:inherit;font-size:15px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:10px}
  button.go{background:var(--ember);color:#1a130a;border:none;border-radius:10px;
    padding:11px 20px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;white-space:nowrap}
  button.go:disabled{opacity:.5;cursor:wait}
  .hint{color:var(--dim);font-size:14px;font-style:italic}
  .thinking{color:var(--gold);font-style:italic}
  .learned{font-size:13px;color:var(--dim);font-style:italic;margin:2px 6px 12px}
  .kilder{font-size:12px;color:var(--dim);font-style:italic;margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
  .forslag{display:flex;flex-wrap:wrap;gap:7px;margin:12px 2px 2px}
  .forslag .lbl{width:100%;color:var(--dim);font-size:13px;font-style:italic;margin-bottom:2px}
  .sug{background:#241d14;border:1px solid var(--line);color:var(--ink);border-radius:999px;
    padding:6px 13px;font-family:inherit;font-size:14px;cursor:pointer}
  .sug:hover{border-color:var(--gold);color:var(--gold)}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:8px}
  button.newchat{background:transparent;color:var(--dim);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:13px}
  button.newchat:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>H I R D S K J A L D</h1>
  <p>din skjald i tjeneste — sig hvad du vil, så gør han det</p>
</header>

<div class="wrap">
  <div class="card">
    <div class="topbar">
      <button id="newChat" class="newchat"
        title="Ryd samtalen — skjalden husker stadig hvem du er (navn og bedrifter)">↺ Ny samtale</button>
    </div>
    <div id="log" class="log">
      <p class="hint">Hils skjalden, spørg om guderne, eller bed om et kvad. Sig bare hvad du vil — prøv fx et af forslagene.</p>
    </div>

    <div id="forslag" class="forslag"><span class="lbl">Prøv fx:</span></div>

    <div class="row">
      <textarea id="chatInput" rows="2" placeholder="Sig til skjalden hvad du vil…"></textarea>
      <button class="go" id="chatSend">Tal</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

// Forslag der viser hvad skjalden kan (klik = send; "…" = udfyld selv)
const FORSLAG = [
  "Hvem er du, og hvad kan du?",
  "Hvem er Odin?",
  "Fortæl en saga om Ragnarok",
  "Fortæl en saga over flere ture — jeg styrer",
  "Kvæd et vers om havet",
  "Jeg hedder … og jeg …",
  "Digt en saga om mig",
  "Lav en saga af det vi har talt om",
  "Glem alt om mig",
];
const fbox = $('#forslag');
FORSLAG.forEach(t=>{
  const b=document.createElement('button'); b.className='sug'; b.textContent=t;
  b.onclick=()=>{
    if(t.includes('…')){ $('#chatInput').value=t.replace(/…/g,''); $('#chatInput').focus(); }
    else { $('#chatInput').value=t; sendChat(); }
  };
  fbox.appendChild(b);
});

async function post(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  return r.json();
}
function bubble(who, cls, text){
  const hint=$('#log .hint'); if(hint) hint.remove();
  const d=document.createElement('div'); d.className='msg '+cls;
  d.innerHTML='<div class="who">'+who+'</div><div class="body"></div>';
  d.querySelector('.body').textContent=text; $('#log').appendChild(d);
  $('#log').scrollTop=$('#log').scrollHeight; return d;
}
async function sendChat(){
  const t=$('#chatInput').value.trim(); if(!t) return;
  $('#chatInput').value=''; bubble('Du','me',t);
  const wait=bubble('Skjald','sk','Skjalden kvæder ved ilden…');
  wait.querySelector('.body').classList.add('thinking');
  $('#chatSend').disabled=true;
  try{
    const j=await post('/api/chat',{text:t});
    const body=wait.querySelector('.body'); body.classList.remove('thinking');
    body.textContent=j.svar||('('+(j.error||'tavshed')+')');
    if(j.skrift){
      const kd=document.createElement('div'); kd.className='kilder';
      let tx='📜 Kvædet efter '+j.skrift;
      if(j.kilder && j.kilder.length) tx+='  ·  via dansk Wikipedia: '+[...new Set(j.kilder)].join(', ');
      kd.textContent=tx; wait.appendChild(kd);
    } else if(j.kilder && j.kilder.length){
      const kd=document.createElement('div'); kd.className='kilder';
      kd.textContent='📚 Kilder: '+[...new Set(j.kilder)].join(', ');
      wait.appendChild(kd);
    }
    if(j.learned && j.learned.length){
      const note=document.createElement('div'); note.className='learned';
      note.textContent='🖉 Skjalden husker nu: '+j.learned.join('; ');
      $('#log').appendChild(note);
    }
  }catch(e){ wait.querySelector('.body').textContent='(skjalden tav — fejl)'; }
  $('#chatSend').disabled=false; $('#log').scrollTop=$('#log').scrollHeight;
}
$('#chatSend').onclick=sendChat;
$('#chatInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}
});

// Ny samtale: rydder samtalen på serveren (men skjalden husker stadig hvem du er)
async function newChat(){
  await post('/api/nysamtale',{});
  $('#log').innerHTML='<p class="hint">Ny samtale, herre. Skjalden husker stadig hvem du er — sig hvad du vil.</p>';
  $('#chatInput').focus();
}
$('#newChat').onclick=newChat;
</script>
</body>
</html>
